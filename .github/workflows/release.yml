name: Release packages

# Builds every release package on GitHub's machines instead of one of ours,
# and tries the Linux ones on fresh distributions before anyone downloads
# them (1.2.27 shipped a Tor that failed on Fedora 44 and Ubuntu 26.04).
#
# Run by hand (Actions -> Release packages -> Run workflow) to get the
# packages as a downloadable artifact. Pushing a v* tag does the same and
# also opens a DRAFT release with them and SHA256SUMS.
#
# The signing key never comes here. SHA256SUMS.asc is made on the
# founder's machine and added to the draft before it is published.

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  # A change to this file is proven on the PR that makes it.
  pull_request:
    paths: ['.github/workflows/release.yml']

permissions:
  contents: read

jobs:
  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    env:
      APPIMAGE_EXTRACT_AND_RUN: '1'   # appimagetool without FUSE
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/checkout@v5
      - name: Dependencies
        run: make deps-linux
      - name: Wallet AppImage with Tor
        run: make appimage-tor
      - name: Headless node
        run: make linux-node
      - name: btfchat AppImage with Tor
        run: make btfchat-appimage-tor
      - name: Self-tests on the shipped node binary
        run: |
          V=$(sed -n 's/^VERSION[[:space:]]*:= *//p' Makefile)
          for t in rules-v3 network-params swap-wait-payment fee-policy; do
            ./bitflash-node-$V-x86_64 -selftest=$t | tail -1
          done
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            Bitflash-*-x86_64.AppImage
            BtfChat-*-x86_64.AppImage
            bitflash-node-*-x86_64
          if-no-files-found: error

  linux-distros:
    name: Linux packages on ${{ matrix.image }}
    needs: linux
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:44', 'ubuntu:26.04', 'ubuntu:24.04', 'debian:13']
    container: ${{ matrix.image }}
    defaults:
      run:
        shell: bash -eo pipefail {0}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: What a desktop has (OpenGL), nothing more
        run: |
          if command -v dnf >/dev/null; then dnf -q -y install mesa-libGL libglvnd-glx findutils procps-ng
          else apt-get -qq update && apt-get -qq install -y libgl1 procps; fi
      - name: The AppImages load and pass their self-tests
        # They carry their own libraries: nothing installed but OpenGL.
        run: |
          chmod +x ./*.AppImage ./bitflash-node-*
          ./Bitflash-*-x86_64.AppImage --appimage-extract >/dev/null && mv squashfs-root wallet
          ./BtfChat-*-x86_64.AppImage --appimage-extract >/dev/null && mv squashfs-root chat
          ./wallet/AppRun -selftest=rules-v3 | tail -1
          ./chat/AppRun -selftest=rules-v3 | tail -1
      - name: The headless node, with the libraries its notes name (Debian/Ubuntu)
        # The node binary uses the system's libraries, so it is for Debian and
        # Ubuntu, where these package names hold; elsewhere, the AppImage.
        if: "!startsWith(matrix.image, 'fedora')"
        run: |
          apt-get -qq install -y libsodium23 libdb5.3++ libsqlite3-0 \
            $(apt-cache show libssl3t64 >/dev/null 2>&1 && echo libssl3t64 || echo libssl3)
          ./bitflash-node-*-x86_64 -selftest=rules-v3 | tail -1
      - name: The bundled Tor runs here
        run: |
          set -e
          for app in wallet chat; do
            tor=$(find $app -name tor -type f | head -1)
            LD_LIBRARY_PATH=$(dirname "$tor") "$tor" --version | head -1
          done
      - name: A fresh wallet finds the network over its own Tor
        # A cold start, from the seeds baked in -- the path every new user
        # takes. The Tor network decides how long it takes; only a node that
        # never gets a peer fails the job.
        timeout-minutes: 8
        run: |
          mkdir -p dd
          ./wallet/AppRun -nogui -managedtor -debug=net -datadir=$PWD/dd > w.out 2>&1 &
          W=$!
          for i in $(seq 1 72); do
            sleep 5
            n=$(grep -c "Added time data" dd/debug.log 2>/dev/null || true)
            if [ "${n:-0}" -gt 0 ]; then echo "peer after $((i*5)) s"; break; fi
          done
          grep -E "hidden service ready|btfseed: reached|Added time data" dd/debug.log | head -5 || true
          kill $W || true
          [ "${n:-0}" -gt 0 ]

  macos:
    name: macOS package (Apple silicon)
    # Terminal only, no .app: the headless node (wallet, solo mining, the
    # chat's wallet) and btfchat, with Tor and the libraries they use inside
    # the folder. Built and tried on GitHub's Apple silicon machines.
    runs-on: macos-14
    env:
      TOR_MAC_SHA256: c99cf6f69740a443c7fffaf598ceb0952b3914041507c8afe11bed84a3333eb1
      TOR_VERSION: 15.0.19
    steps:
      - uses: actions/checkout@v5
      - name: Homebrew libraries
        run: brew install openssl@3 berkeley-db@5 libsodium sqlite glfw boost nlohmann-json cmake dylibbundler
      - name: secp256k1 and RandomX, at the commits the other builds pin
        run: |
          set -e
          SECP=$(sed -n 's/^SECP256K1_COMMIT *:= *//p' Makefile)
          RX=$(sed -n 's/^RANDOMX_COMMIT *:= *//p' Makefile)
          git init -q ~/secp && cd ~/secp
          git remote add origin https://github.com/bitcoin-core/secp256k1
          git fetch -q --depth 1 origin $SECP && git checkout -q --detach FETCH_HEAD
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DSECP256K1_ENABLE_MODULE_SCHNORRSIG=ON \
            -DSECP256K1_ENABLE_MODULE_EXTRAKEYS=ON -DSECP256K1_BUILD_BENCHMARK=OFF -DSECP256K1_BUILD_TESTS=OFF \
            -DSECP256K1_BUILD_EXHAUSTIVE_TESTS=OFF -DSECP256K1_BUILD_CTIME_TESTS=OFF -DSECP256K1_BUILD_EXAMPLES=OFF \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX=$HOME/deps >/dev/null
          cmake --build build -j3 >/dev/null && cmake --install build >/dev/null
          git init -q ~/RandomX && cd ~/RandomX
          git remote add origin https://github.com/tevador/RandomX
          git fetch -q --depth 1 origin $RX && git checkout -q --detach FETCH_HEAD
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release >/dev/null && cmake --build build -j3 --target randomx >/dev/null
      - name: Build the node and btfchat
        run: make -C src -j3 bitflash-node btfchat SECP_INC=$HOME/deps/include SECP_LIB=$HOME/deps/lib RANDOMX_DIR=$HOME/RandomX
      - name: Tor for macOS, the official bundle, checked against its pinned hash
        run: |
          set -eo pipefail
          curl -sfL -o tor.tar.gz https://archive.torproject.org/tor-package-archive/torbrowser/$TOR_VERSION/tor-expert-bundle-macos-aarch64-$TOR_VERSION.tar.gz
          echo "$TOR_MAC_SHA256  tor.tar.gz" | shasum -a 256 -c -
          mkdir -p torx && tar -xzf tor.tar.gz -C torx
      - name: The whole test suite, as on Windows and Linux
        # Every unit test program and every self-test of make tests, on the Mac.
        run: make -C src tests SECP_INC=$HOME/deps/include SECP_LIB=$HOME/deps/lib RANDOMX_DIR=$HOME/RandomX BITFLASH_TOR=$PWD/torx/tor/tor
        env:
          BITFLASH_TOR: ${{ github.workspace }}/torx/tor/tor
      - name: The folder people download
        run: |
          set -eo pipefail
          V=$(sed -n 's/^VERSION[[:space:]]*:= *//p' Makefile)
          D=Bitflash-$V-macos-arm64
          mkdir -p $D/lib
          cp src/bitflash-node src/btfchat $D/
          # Homebrew's libraries go inside, found next to the binaries.
          B=$(brew --prefix)
          dylibbundler -cd -b -x $D/bitflash-node -x $D/btfchat -d $D/lib -p @executable_path/lib/ \
            -s $B/lib -s $B/opt/openssl@3/lib -s $B/opt/berkeley-db@5/lib -s $B/opt/sqlite/lib </dev/null >/dev/null
          cp -R torx/tor $D/tor
          [ -d torx/data ] && mkdir -p $D/tor/data-defaults && cp -R torx/data/. $D/tor/data-defaults/
          cp packaging/macos/README-macOS.txt $D/
          # Apple silicon runs only signed code; ours had their library paths
          # just rewritten, so they are signed again (ad hoc: no Apple account).
          # Tor keeps the Tor Project's own signature.
          for f in $D/bitflash-node $D/btfchat $D/lib/*.dylib; do codesign --force -s - "$f"; done
          echo "--- what the binaries load (nothing from Homebrew may remain):"
          otool -L $D/bitflash-node $D/btfchat | grep -v ":$"
          ! otool -L $D/bitflash-node $D/btfchat | grep -q /opt/homebrew
          tar -czf $D.tar.gz $D
          echo "D=$D" >> $GITHUB_ENV
      - name: The folder works without Homebrew
        run: |
          set -eo pipefail
          # Homebrew out of the way, as on a Mac that never had it.
          brew_prefix=$(brew --prefix)
          sudo mv "$brew_prefix" "$brew_prefix.away"
          trap 'sudo mv "$brew_prefix.away" "$brew_prefix"' EXIT
          mkdir -p try && tar -xzf $D.tar.gz -C try && cd try/$D
          ./bitflash-node -selftest=rules-v3 | tail -1
          ./btfchat -selftest=rules-v3 | tail -1
          DYLD_LIBRARY_PATH=$PWD/tor ./tor/tor --version | head -1
      - name: A fresh node finds the network over its own Tor
        timeout-minutes: 8
        run: |
          cd try/$D
          mkdir -p dd
          ./bitflash-node -nogui -managedtor -debug=net -datadir=$PWD/dd > n.out 2>&1 &
          W=$!
          for i in $(seq 1 72); do
            sleep 5
            n=$(grep -c "Added time data" dd/debug.log 2>/dev/null || true)
            if [ "${n:-0}" -gt 0 ]; then echo "peer after $((i*5)) s"; break; fi
          done
          grep -E "hidden service ready|btfseed: reached|Added time data" dd/debug.log | head -5 || true
          kill $W || true
          [ "${n:-0}" -gt 0 ]
      - name: btfchat opens its window from Terminal and stays up
        # GitHub's Macs have a screen; the window is captured for a person to see.
        timeout-minutes: 3
        run: |
          cd try/$D
          export HOME=$PWD/chat-home && mkdir -p $HOME
          ./btfchat -testnet > chat.out 2>&1 &
          C=$!
          sleep 25
          screencapture -x $GITHUB_WORKSPACE/btfchat-macos.png || true
          if kill -0 $C 2>/dev/null; then echo "btfchat still running after 25 s"; ok=1; else echo "btfchat exited:"; ok=0; fi
          tail -20 chat.out
          kill $C 2>/dev/null || true
          [ "$ok" = 1 ]
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-screenshot
          path: btfchat-macos.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Bitflash-*-macos-arm64.tar.gz
          if-no-files-found: error

  macos-miner:
    name: Bitflash Miner for macOS (Apple silicon)
    runs-on: macos-14
    env:
      XMRIG_MAC_SHA256: 6ae4eb4216e99a201ae9a3d2c3a7c275207c5165cfc25da1f3d735d6c4829c18
      TOR_MAC_SHA256: c99cf6f69740a443c7fffaf598ceb0952b3914041507c8afe11bed84a3333eb1
      TOR_VERSION: 15.0.19
    steps:
      - uses: actions/checkout@v5
      - name: Official XMRig and Tor, checked against their published hashes
        run: |
          set -eo pipefail
          curl -sfL -o xmrig.tar.gz https://github.com/xmrig/xmrig/releases/download/v6.26.0/xmrig-6.26.0-macos-arm64.tar.gz
          echo "$XMRIG_MAC_SHA256  xmrig.tar.gz" | shasum -a 256 -c -
          curl -sfL -o tor.tar.gz https://archive.torproject.org/tor-package-archive/torbrowser/$TOR_VERSION/tor-expert-bundle-macos-aarch64-$TOR_VERSION.tar.gz
          echo "$TOR_MAC_SHA256  tor.tar.gz" | shasum -a 256 -c -
      - name: The folder people download
        run: |
          set -eo pipefail
          V=$(sed -n 's/^VERSION[[:space:]]*:= *//p' Makefile)
          D=Bitflash-Miner-$V-macos-arm64
          mkdir -p $D/xmrig $D/tor $D/licenses x t
          tar -xzf xmrig.tar.gz -C x && tar -xzf tor.tar.gz -C t
          cp x/xmrig-6.26.0/xmrig $D/xmrig/
          cp x/xmrig-6.26.0/LICENSE $D/licenses/XMRIG-LICENSE.txt 2>/dev/null || true
          cp -R t/tor/. $D/tor/
          rm -rf $D/tor/pluggable_transports
          cp scripts/bitflash-miner/mine.sh scripts/bitflash-miner/README.txt $D/
          chmod +x $D/mine.sh $D/xmrig/xmrig $D/tor/tor
          (cd $D && shasum -a 256 $(find . -type f ! -name SHA256SUMS | sed 's#^\./##' | sort) > SHA256SUMS)
          tar -czf $D.tar.gz $D
          echo "D=$D" >> $GITHUB_ENV
      - name: XMRig and Tor run here
        run: |
          set -eo pipefail
          mkdir try && tar -xzf $D.tar.gz -C try && cd try/$D
          ./xmrig/xmrig --version | head -1
          DYLD_LIBRARY_PATH=$PWD/tor ./tor/tor --version | head -1
      - name: The launcher reaches the pool over Tor (report only)
        # The pool is one machine of ours; its being down must not stop a
        # release, so this reports and never fails the job.
        continue-on-error: true
        timeout-minutes: 6
        run: |
          cd try/$D
          # A testnet payout address: what is checked is the path to the pool.
          ./mine.sh BJ9V4GqJboC3ibUvGTgJYZzZ7TxQh9eS3D testnet -t 1 --log-file=xm.log --no-color >/dev/null 2>&1 &
          M=$!
          for i in $(seq 1 48); do sleep 5; grep -q "new job" xm.log 2>/dev/null && break; done
          kill $M 2>/dev/null; sleep 2
          echo "--- pool's answer:"; grep -E "use pool|new job" xm.log | head -3
          grep -q "new job" xm.log
      - uses: actions/upload-artifact@v4
        with:
          name: macos-miner
          path: Bitflash-Miner-*-macos-arm64.tar.gz
          if-no-files-found: error

  windows:
    name: Windows package
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            zip
            unzip
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-db
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-libsodium
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-cmake
            autoconf
            automake
            libtool
      - name: Build the zip with Tor
        run: make windows-tor
      - name: The zip runs on its own (no MSYS2 on the PATH)
        shell: pwsh
        run: |
          $v = (Select-String -Path Makefile -Pattern '^VERSION\s*:=\s*(\S+)').Matches[0].Groups[1].Value
          Expand-Archive "Bitflash-$v-windows-with-tor.zip" -DestinationPath unpacked
          $env:PATH = "C:\Windows\System32;C:\Windows"
          $dir = "unpacked\Bitflash-$v-windows"
          foreach ($t in "rules-v3", "network-params", "swap-wait-payment") {
            $p = Start-Process "$dir\Bitflash.exe" -ArgumentList "-selftest=$t" -NoNewWindow -Wait -PassThru -RedirectStandardOutput "st-$t.txt"
            Get-Content "st-$t.txt" | Select-Object -Last 1
            if ($p.ExitCode -ne 0) { exit 1 }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Bitflash-*-windows-with-tor.zip
          if-no-files-found: error

  draft:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, linux-distros, windows, macos, macos-miner]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd out
          rm -f ./*.png   # the test screenshot is for us, not a download
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Open a draft (nothing is public until the founder publishes it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --draft \
            --title "Bitflash ${GITHUB_REF_NAME#v}" \
            --notes "Draft from the release workflow. The notes, the Bitflash Miner packages and SHA256SUMS.asc are added before publishing."
